[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scpi-sim"
version = "0.4.0"
description = "Simulated SCPI lab instruments (DMM, power supply, multiplexer) on a raw TCP socket"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ralf Steinert"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["scpi", "simulator", "test automation", "pyvisa", "instrument", "lab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/steitec/scpi-sim"
Repository = "https://github.com/steitec/scpi-sim"
Changelog = "https://github.com/steitec/scpi-sim/blob/main/CHANGELOG.md"
Issues = "https://github.com/steitec/scpi-sim/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pyvisa>=1.13", "pyvisa-py>=0.7", "pyserial>=3.5", "build>=1.2"]

[project.scripts]
scpi-sim = "scpi_sim.cli:main"

[project.entry-points.pytest11]
scpi_sim = "scpi_sim.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
