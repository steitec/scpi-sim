# The browser demo's bench: examples/profiles/bench.yaml, plus a board on channel 3
# of the supply whose power-on the scope can catch (examples/power_on/power_board.py).
instruments:
  psu: {profile: rs-hmp4040, port: 5025}
  daq: {profile: keysight-daq970a, port: 5026}
  scope:
    profile: rigol-ds1054z
    port: 5027
    signals:
      1: {shape: sine, frequency: 1000, vpp: 2}
loads:
  rail_12v: {type: resistor, ohms: 24}    # 0.5 A at 12 V
  rail_5v: {type: resistor, ohms: 10}     # 0.5 A at 5 V
devices:
  board:
    class: "power_board:PowerBoard"
wiring:
  - psu.ch3 -> board.vin
  - scope.ch3 -> board.isense             # a 100 mV/A current probe
  - scope.ch4 -> board.3V3
  - psu.ch1 -> rail_12v
  - psu.ch2 -> rail_5v
  - daq.101 -> rail_12v                   # the DAQ's built-in DMM sits on its common
  - daq.102 -> rail_5v
  - scope.ch2 -> rail_12v
