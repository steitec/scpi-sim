# nginx for the browser demo: static files only. The Pyodide runtime (in a
# directory named after its version) and the wheel (version in the file name) are
# cached for a year; everything else is revalidated.
map $uri $cache_control {
    ~^/pyodide/[0-9][^/]*/ "public, max-age=31536000, immutable";
    ~^/py/.*\.whl$         "public, max-age=31536000, immutable";
    default                "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types application/javascript text/javascript application/wasm application/json text/css image/svg+xml;
    gzip_min_length 1024;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "interest-cohort=()" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }

    # not in nginx's mime.types; browsers refuse module scripts with another type
    location ~ \.mjs$ {
        default_type text/javascript;
    }
}
