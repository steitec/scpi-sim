# A power rail and a clock, seen by an oscilloscope:
#   scpi-sim serve --bench examples/scope/bench.yaml
instruments:
  psu: {profile: rs-hmp4040, port: 5025}
  scope:
    profile: keysight-dsox2024a
    port: 5026
    signals:
      2: {shape: square, frequency: 10000, vpp: 3.3, offset: 1.65}
loads:
  rail_12v: {type: resistor, ohms: 24}
wiring:
  - psu.ch1 -> rail_12v
  - scope.ch1 -> rail_12v   # a channel on a supply's net shows its DC voltage
control: 5099
