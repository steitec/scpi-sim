name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - run: pytest -v examples/test_example.py --scpi-bench examples/bench.yaml
      - run: pytest -v examples/devices --scpi-bench examples/devices/bench.yaml
      - run: pytest -v examples/profiles --scpi-bench examples/profiles/bench.yaml
      - run: pytest -v web/tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t scpi-sim:ci .
      - run: docker run -d --name sim -p 5025-5027:5025-5027 scpi-sim:ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install .
      - name: The container answers *IDN?
        run: |
          for i in $(seq 1 30); do scpi-sim query --timeout 1 "*IDN?" && break; sleep 1; done
          scpi-sim query "*IDN?" | grep '^scpi-sim,PSU'
      - if: always()
        run: docker logs sim; docker rm -f sim

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the demo container
        working-directory: .
        run: |
          docker build -f web/Dockerfile -t scpi-sim-web .
          docker run -d --name web -p 8080:80 scpi-sim-web
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results
          path: web/test-results/
      - if: always()
        working-directory: .
        run: docker logs web; docker rm -f web
